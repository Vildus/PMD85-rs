[package]
name = "pmd85-app"
description = "Desktop application for the PMD 85 emulator (wgpu renderer)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pmd85"
path = "src/main.rs"

[dependencies]
pmd85-core = { workspace = true }
wgpu = "30"
winit = "0.30"
pollster = "0.3"
log = "0.4"
env_logger = "0.11"
cpal = "0.18"
egui = "0.36"
egui-wgpu = { version = "0.36", features = ["winit", "x11", "wayland"] }
egui-winit = "0.36"
egui-phosphor = { version = "0.14", features = ["regular", "fill"] }
egui_dock = { version = "0.21", features = ["serde"] }
rfd = "0.15"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
# PNG decode of the embedded app icon (nothing else).
image = { version = "0.25", default-features = false, features = ["png"] }
